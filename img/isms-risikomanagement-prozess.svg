<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="rmArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6971"/>
    </marker>
    <marker id="rmArrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E2001A"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="150" height="80" rx="8" fill="#E3F0F4" stroke="#1C7B96" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-weight="bold" fill="#0A3A4A">1. Identifikation</text>
  <text x="95" y="112" text-anchor="middle" font-size="12" fill="#0A3A4A">Assets, Bedrohungen,</text>
  <text x="95" y="128" text-anchor="middle" font-size="12" fill="#0A3A4A">Schwachstellen</text>

  <rect x="195" y="60" width="150" height="80" rx="8" fill="#E3F0F4" stroke="#1C7B96" stroke-width="2"/>
  <text x="270" y="90" text-anchor="middle" font-weight="bold" fill="#0A3A4A">2. Analyse</text>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#0A3A4A">Wahrscheinlichkeit</text>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#0A3A4A">× Schadenshöhe</text>

  <rect x="370" y="60" width="150" height="80" rx="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="445" y="90" text-anchor="middle" font-weight="bold" fill="#8A4B08">3. Bewertung</text>
  <text x="445" y="112" text-anchor="middle" font-size="12" fill="#8A4B08">Vergleich mit</text>
  <text x="445" y="128" text-anchor="middle" font-size="12" fill="#8A4B08">Akzeptanzkriterien</text>

  <rect x="545" y="60" width="150" height="80" rx="8" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="2"/>
  <text x="620" y="90" text-anchor="middle" font-weight="bold" fill="#1E4620">4. Behandlung</text>
  <text x="620" y="112" text-anchor="middle" font-size="12" fill="#1E4620">vermeiden, reduzieren,</text>
  <text x="620" y="128" text-anchor="middle" font-size="12" fill="#1E4620">übertragen, akzeptieren</text>

  <rect x="720" y="60" width="150" height="80" rx="8" fill="#EEF1F2" stroke="#5C6971" stroke-width="2"/>
  <text x="795" y="90" text-anchor="middle" font-weight="bold" fill="#3E4A51">5. Überwachung</text>
  <text x="795" y="112" text-anchor="middle" font-size="12" fill="#3E4A51">Wirksamkeit prüfen,</text>
  <text x="795" y="128" text-anchor="middle" font-size="12" fill="#3E4A51">neu bewerten</text>

  <line x1="175" y1="100" x2="190" y2="100" stroke="#5C6971" stroke-width="2" marker-end="url(#rmArrow)"/>
  <line x1="350" y1="100" x2="365" y2="100" stroke="#5C6971" stroke-width="2" marker-end="url(#rmArrow)"/>
  <line x1="525" y1="100" x2="540" y2="100" stroke="#5C6971" stroke-width="2" marker-end="url(#rmArrow)"/>
  <line x1="700" y1="100" x2="715" y2="100" stroke="#5C6971" stroke-width="2" marker-end="url(#rmArrow)"/>

  <path d="M 795 145 L 795 200 L 95 200 L 95 150" fill="none" stroke="#E2001A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#rmArrowRed)"/>
  <text x="445" y="222" text-anchor="middle" fill="#8C0010">neue Bedrohungen, geänderte Assets, Vorfälle → erneuter Durchlauf</text>
</svg>
