<svg width="900" height="230" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <!-- Zeitachse -->
  <line x1="60" y1="110" x2="840" y2="110" stroke="#3E4A51" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Punkt: Vorfall entdeckt -->
  <circle cx="100" cy="110" r="8" fill="#EEF1F2" stroke="#5C6971" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" font-weight="bold">Vorfall entdeckt</text>
  <text x="100" y="90" text-anchor="middle" font-size="11">t = 0</text>
  <text x="100" y="145" text-anchor="middle" font-size="11">Datenschutzverletzung</text>
  <text x="100" y="160" text-anchor="middle" font-size="11">wird bekannt</text>

  <!-- Punkt: Meldung an Aufsichtsbehörde -->
  <circle cx="470" cy="110" r="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="470" y="70" text-anchor="middle" font-weight="bold">Meldung an Aufsichtsbehörde</text>
  <text x="470" y="90" text-anchor="middle" font-size="11">spätestens nach 72 Stunden</text>
  <text x="470" y="145" text-anchor="middle" font-size="11">wenn Risiko für Rechte &amp;</text>
  <text x="470" y="160" text-anchor="middle" font-size="11">Freiheiten der Personen besteht</text>

  <!-- Punkt: Betroffene informieren -->
  <circle cx="800" cy="110" r="8" fill="#FBE3E6" stroke="#E2001A" stroke-width="2"/>
  <text x="800" y="70" text-anchor="middle" font-weight="bold">Betroffene informieren</text>
  <text x="800" y="90" text-anchor="middle" font-size="11">unverzüglich</text>
  <text x="800" y="145" text-anchor="middle" font-size="11">nur bei hohem Risiko</text>
  <text x="800" y="160" text-anchor="middle" font-size="11">(z. B. gestohlene Passwörter)</text>

</svg>
