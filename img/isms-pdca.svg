<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     style="font-family: Arial, sans-serif; font-size: 14px">

  <defs>
    <marker id="pdcaArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6971"/>
    </marker>
  </defs>

  <rect x="110" y="25" width="200" height="90" rx="8" fill="#E3F0F4" stroke="#1C7B96" stroke-width="2"/>
  <text x="210" y="58" text-anchor="middle" font-weight="bold" font-size="17" fill="#0A3A4A">PLAN</text>
  <text x="210" y="80" text-anchor="middle" fill="#0A3A4A">Scope, Risiken,</text>
  <text x="210" y="98" text-anchor="middle" fill="#0A3A4A">Ziele, Maßnahmenplan</text>

  <rect x="390" y="25" width="200" height="90" rx="8" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="2"/>
  <text x="490" y="58" text-anchor="middle" font-weight="bold" font-size="17" fill="#1E4620">DO</text>
  <text x="490" y="80" text-anchor="middle" fill="#1E4620">Maßnahmen umsetzen,</text>
  <text x="490" y="98" text-anchor="middle" fill="#1E4620">schulen, betreiben</text>

  <rect x="390" y="190" width="200" height="90" rx="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="490" y="223" text-anchor="middle" font-weight="bold" font-size="17" fill="#8A4B08">CHECK</text>
  <text x="490" y="245" text-anchor="middle" fill="#8A4B08">Kennzahlen, Audits,</text>
  <text x="490" y="263" text-anchor="middle" fill="#8A4B08">Vorfallsauswertung</text>

  <rect x="110" y="190" width="200" height="90" rx="8" fill="#FBE3E6" stroke="#E2001A" stroke-width="2"/>
  <text x="210" y="223" text-anchor="middle" font-weight="bold" font-size="17" fill="#8C0010">ACT</text>
  <text x="210" y="245" text-anchor="middle" fill="#8C0010">Korrigieren, anpassen,</text>
  <text x="210" y="263" text-anchor="middle" fill="#8C0010">verbessern</text>

  <line x1="315" y1="70" x2="385" y2="70" stroke="#5C6971" stroke-width="2" marker-end="url(#pdcaArrow)"/>
  <line x1="490" y1="120" x2="490" y2="185" stroke="#5C6971" stroke-width="2" marker-end="url(#pdcaArrow)"/>
  <line x1="385" y1="235" x2="315" y2="235" stroke="#5C6971" stroke-width="2" marker-end="url(#pdcaArrow)"/>
  <line x1="210" y1="185" x2="210" y2="120" stroke="#5C6971" stroke-width="2" marker-end="url(#pdcaArrow)"/>

  <text x="350" y="160" text-anchor="middle" font-size="12" fill="#5C6971">kontinuierliche Verbesserung</text>
</svg>
