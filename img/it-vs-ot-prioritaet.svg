<svg width="700" height="320" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <!-- Baseline -->
  <line x1="40" y1="280" x2="660" y2="280" stroke="#3E4A51" stroke-width="1.5"/>

  <!-- Gruppentitel -->
  <text x="180" y="30" text-anchor="middle" font-weight="bold" fill="#0A3A4A">IT: Vertraulichkeit zuerst</text>
  <text x="510" y="30" text-anchor="middle" font-weight="bold" fill="#6B3A06">OT/ICS: Verfügbarkeit zuerst</text>

  <!-- Trenner -->
  <line x1="350" y1="45" x2="350" y2="280" stroke="#C3CBCF" stroke-width="1" stroke-dasharray="4"/>

  <!-- IT-Balken: C, I, A -->
  <rect x="70" y="80" width="60" height="200" fill="#E3F0F4" stroke="#1C7B96" stroke-width="1.5"/>
  <text x="100" y="70" text-anchor="middle" font-weight="bold" fill="#0A3A4A">1</text>
  <text x="100" y="300" text-anchor="middle" fill="#3E4A51">Vertraulichkeit</text>

  <rect x="150" y="150" width="60" height="130" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="1.5"/>
  <text x="180" y="140" text-anchor="middle" font-weight="bold" fill="#1E4620">2</text>
  <text x="180" y="300" text-anchor="middle" fill="#3E4A51">Integrität</text>

  <rect x="230" y="210" width="60" height="70" fill="#FCF0DC" stroke="#E8930A" stroke-width="1.5"/>
  <text x="260" y="200" text-anchor="middle" font-weight="bold" fill="#6B3A06">3</text>
  <text x="260" y="300" text-anchor="middle" fill="#3E4A51">Verfügbarkeit</text>

  <!-- OT-Balken: A, I, C -->
  <rect x="410" y="80" width="60" height="200" fill="#FCF0DC" stroke="#E8930A" stroke-width="1.5"/>
  <text x="440" y="70" text-anchor="middle" font-weight="bold" fill="#6B3A06">1</text>
  <text x="440" y="300" text-anchor="middle" fill="#3E4A51">Verfügbarkeit</text>

  <rect x="490" y="150" width="60" height="130" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="1.5"/>
  <text x="520" y="140" text-anchor="middle" font-weight="bold" fill="#1E4620">2</text>
  <text x="520" y="300" text-anchor="middle" fill="#3E4A51">Integrität</text>

  <rect x="570" y="210" width="60" height="70" fill="#E3F0F4" stroke="#1C7B96" stroke-width="1.5"/>
  <text x="600" y="200" text-anchor="middle" font-weight="bold" fill="#0A3A4A">3</text>
  <text x="600" y="300" text-anchor="middle" fill="#3E4A51">Vertraulichkeit</text>

</svg>
