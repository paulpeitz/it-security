<svg width="720" height="380" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <!-- Headers -->
  <text x="110" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3A4A">Alice</text>
  <text x="610" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E4620">Bob</text>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#8C0010">Lauscher (Eve)</text>

  <!-- public base color -->
  <circle cx="360" cy="70" r="16" fill="#F7D9A0" stroke="#E8930A" stroke-width="2"/>
  <text x="360" y="105" text-anchor="middle" font-size="12" fill="#3E4A51">öffentliche Grundfarbe</text>

  <!-- Alice secret -->
  <circle cx="110" cy="150" r="16" fill="#8FC4D4" stroke="#1C7B96" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#3E4A51">+ geheime Farbe</text>
  <!-- Bob secret -->
  <circle cx="610" cy="150" r="16" fill="#A8D08D" stroke="#4C9A2A" stroke-width="2"/>
  <text x="610" y="185" text-anchor="middle" font-size="11" fill="#3E4A51">+ geheime Farbe</text>

  <!-- Mixtures exchanged -->
  <circle cx="110" cy="230" r="18" fill="#A8D08D" stroke="#2F8F7D" stroke-width="2"/>
  <circle cx="610" cy="230" r="18" fill="#A8D08D" stroke="#2F8F7D" stroke-width="2"/>
  <text x="110" y="268" text-anchor="middle" font-size="11" fill="#3E4A51">Mischung A</text>
  <text x="610" y="268" text-anchor="middle" font-size="11" fill="#3E4A51">Mischung B</text>

  <!-- exchange arrows through public -->
  <line x1="132" y1="230" x2="588" y2="230" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="588" y1="248" x2="132" y2="248" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#8C0010">öffentlich getauscht (Eve sieht mit)</text>

  <!-- final shared secret -->
  <circle cx="110" cy="330" r="20" fill="#5A2A5E" stroke="#3D1C40" stroke-width="2"/>
  <circle cx="610" cy="330" r="20" fill="#5A2A5E" stroke="#3D1C40" stroke-width="2"/>
  <text x="110" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D1C40">geheimer Schlüssel</text>
  <text x="610" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D1C40">geheimer Schlüssel</text>
  <text x="360" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E8E5A">= identisch!</text>

  <!-- Eve cannot -->
  <rect x="300" y="300" width="120" height="48" rx="8" fill="#FBE3E6" stroke="#E2001A" stroke-width="2"/>
  <text x="360" y="322" text-anchor="middle" font-size="11" fill="#8C0010">Farben trennen</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#8C0010">= unmöglich</text>
</svg>
