<svg width="700" height="320" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="arrow-cost" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <!-- Achsen -->
  <line x1="70" y1="30" x2="70" y2="260" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cost)"/>
  <line x1="70" y1="260" x2="670" y2="260" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cost)"/>
  <text x="30" y="145" fill="#3E4A51" transform="rotate(-90 30 145)" text-anchor="middle">Kosten der Behebung</text>
  <text x="370" y="295" fill="#3E4A51" text-anchor="middle">Phase, in der der Fehler gefunden wird</text>

  <!-- Balken -->
  <rect x="110" y="230" width="70" height="30" fill="#EAF4E2" stroke="#4C9A2A"/>
  <text x="145" y="220" fill="#3E4A51" text-anchor="middle">1x</text>
  <text x="145" y="278" fill="#3E4A51" text-anchor="middle">Planung</text>

  <rect x="220" y="210" width="70" height="50" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="255" y="200" fill="#3E4A51" text-anchor="middle">2x</text>
  <text x="255" y="278" fill="#3E4A51" text-anchor="middle">Design</text>

  <rect x="330" y="175" width="70" height="85" fill="#FCF0DC" stroke="#E8930A"/>
  <text x="365" y="165" fill="#3E4A51" text-anchor="middle">5x</text>
  <text x="365" y="278" fill="#3E4A51" text-anchor="middle">Implementierung</text>

  <rect x="440" y="120" width="70" height="140" fill="#FCF0DC" stroke="#E8930A"/>
  <text x="475" y="110" fill="#3E4A51" text-anchor="middle">10x</text>
  <text x="475" y="278" fill="#3E4A51" text-anchor="middle">Testing</text>

  <rect x="550" y="55" width="70" height="205" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="585" y="45" fill="#3E4A51" text-anchor="middle">30x+</text>
  <text x="585" y="278" fill="#3E4A51" text-anchor="middle">Produktion</text>

</svg>
