<svg width="760" height="320" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="arrow-cicd" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <!-- Pipeline-Schritte -->
  <rect x="20" y="60" width="100" height="55" rx="6" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="70" y="92" fill="#3E4A51" text-anchor="middle">Commit</text>

  <rect x="160" y="60" width="100" height="55" rx="6" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="210" y="92" fill="#3E4A51" text-anchor="middle">Build</text>

  <rect x="300" y="60" width="100" height="55" rx="6" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="350" y="92" fill="#3E4A51" text-anchor="middle">Staging</text>

  <rect x="440" y="60" width="100" height="55" rx="6" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="490" y="85" fill="#3E4A51" text-anchor="middle">Production</text>
  <text x="490" y="100" fill="#3E4A51" text-anchor="middle">Deploy</text>

  <rect x="600" y="60" width="120" height="55" rx="6" fill="#EAF4E2" stroke="#4C9A2A"/>
  <text x="660" y="92" fill="#3E4A51" text-anchor="middle">Monitoring</text>

  <!-- Pfeile zwischen Schritten -->
  <line x1="120" y1="87" x2="158" y2="87" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>
  <line x1="260" y1="87" x2="298" y2="87" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>
  <line x1="400" y1="87" x2="438" y2="87" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>
  <line x1="540" y1="87" x2="598" y2="87" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>

  <!-- Security Gates darunter -->
  <rect x="30" y="160" width="80" height="55" rx="6" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="70" y="182" fill="#3E4A51" text-anchor="middle" font-size="11">Secret</text>
  <text x="70" y="197" fill="#3E4A51" text-anchor="middle" font-size="11">Scanning</text>

  <rect x="170" y="160" width="80" height="55" rx="6" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="210" y="182" fill="#3E4A51" text-anchor="middle" font-size="11">SAST +</text>
  <text x="210" y="197" fill="#3E4A51" text-anchor="middle" font-size="11">SCA</text>

  <rect x="310" y="160" width="80" height="55" rx="6" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="350" y="182" fill="#3E4A51" text-anchor="middle" font-size="11">DAST</text>

  <rect x="450" y="160" width="80" height="55" rx="6" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="490" y="182" fill="#3E4A51" text-anchor="middle" font-size="11">Security</text>
  <text x="490" y="197" fill="#3E4A51" text-anchor="middle" font-size="11">Gate</text>

  <!-- Verbindungslinien Gate zu Schritt -->
  <line x1="70" y1="115" x2="70" y2="158" stroke="#E2001A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="210" y1="115" x2="210" y2="158" stroke="#E2001A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="115" x2="350" y2="158" stroke="#E2001A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="490" y1="115" x2="490" y2="158" stroke="#E2001A" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="380" y="255" fill="#E2001A" text-anchor="middle" font-weight="bold">Gates stoppen die Pipeline bei kritischen Findings</text>
  <text x="380" y="280" fill="#3E4A51" text-anchor="middle">Je früher ein Fund, desto günstiger die Behebung (Shift Left)</text>

</svg>
