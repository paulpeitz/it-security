<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="nisArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6971"/>
    </marker>
  </defs>

  <line x1="40" y1="120" x2="830" y2="120" stroke="#5C6971" stroke-width="2" marker-end="url(#nisArrow)"/>

  <circle cx="90" cy="120" r="8" fill="#E2001A"/>
  <text x="90" y="150" text-anchor="middle" font-weight="bold" fill="#8C0010">Kenntnis</text>
  <text x="90" y="168" text-anchor="middle" font-size="12" fill="#5C6971">des Vorfalls</text>

  <circle cx="290" cy="120" r="8" fill="#E8930A"/>
  <rect x="190" y="35" width="200" height="60" rx="6" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="290" y="58" text-anchor="middle" font-weight="bold" fill="#8A4B08">24 Stunden</text>
  <text x="290" y="78" text-anchor="middle" font-size="12" fill="#8A4B08">Frühwarnung</text>
  <line x1="290" y1="95" x2="290" y2="112" stroke="#E8930A" stroke-width="2"/>

  <circle cx="520" cy="120" r="8" fill="#1C7B96"/>
  <rect x="420" y="35" width="200" height="60" rx="6" fill="#E3F0F4" stroke="#1C7B96" stroke-width="2"/>
  <text x="520" y="58" text-anchor="middle" font-weight="bold" fill="#0A3A4A">72 Stunden</text>
  <text x="520" y="78" text-anchor="middle" font-size="12" fill="#0A3A4A">Vorfallsmeldung mit Bewertung</text>
  <line x1="520" y1="95" x2="520" y2="112" stroke="#1C7B96" stroke-width="2"/>

  <circle cx="750" cy="120" r="8" fill="#4C9A2A"/>
  <rect x="650" y="35" width="200" height="60" rx="6" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="2"/>
  <text x="750" y="58" text-anchor="middle" font-weight="bold" fill="#1E4620">1 Monat</text>
  <text x="750" y="78" text-anchor="middle" font-size="12" fill="#1E4620">Abschlussbericht</text>
  <line x1="750" y1="95" x2="750" y2="112" stroke="#4C9A2A" stroke-width="2"/>

  <text x="430" y="205" text-anchor="middle" font-size="12" fill="#5C6971">Zwischenbericht auf Anforderung der Behörde jederzeit möglich</text>
</svg>
