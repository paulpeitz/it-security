<svg width="720" height="330" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <text x="110" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3A4A">Absender</text>
  <text x="610" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E4620">Empfänger</text>

  <!-- Step 1: random AES key -->
  <rect x="40" y="55" width="150" height="50" rx="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="115" y="76" text-anchor="middle" font-size="12" fill="#3E4A51">1. zufälliger</text>
  <text x="115" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A4B08">AES-Schlüssel</text>

  <!-- Step 2: data encrypted with AES -->
  <rect x="40" y="140" width="150" height="60" rx="8" fill="#E3F0F4" stroke="#1C7B96" stroke-width="2"/>
  <text x="115" y="163" text-anchor="middle" font-size="12" fill="#3E4A51">2. Daten mit AES</text>
  <text x="115" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A3A4A">verschlüsseln (schnell)</text>

  <!-- Step 3: AES key encrypted with RSA public -->
  <rect x="40" y="235" width="150" height="60" rx="8" fill="#F0E6F1" stroke="#7D3C82" stroke-width="2"/>
  <text x="115" y="258" text-anchor="middle" font-size="11" fill="#3E4A51">3. AES-Schlüssel mit</text>
  <text x="115" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#5A2A5E">RSA-Public verschlüsseln</text>

  <!-- transmitted package -->
  <rect x="285" y="130" width="150" height="90" rx="8" fill="#EEF1F2" stroke="#5C6971" stroke-width="2"/>
  <text x="360" y="118" text-anchor="middle" font-size="12" fill="#3E4A51">Übertragung</text>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#0A3A4A">[AES-verschl. Daten]</text>
  <text x="360" y="185" text-anchor="middle" font-size="11" fill="#5A2A5E">[RSA-verschl. Schlüssel]</text>

  <!-- arrows to package -->
  <line x1="190" y1="170" x2="285" y2="160" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="265" x2="285" y2="190" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- receiver side -->
  <rect x="530" y="130" width="160" height="55" rx="8" fill="#F0E6F1" stroke="#7D3C82" stroke-width="2"/>
  <text x="610" y="152" text-anchor="middle" font-size="11" fill="#3E4A51">4. AES-Schlüssel mit</text>
  <text x="610" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#5A2A5E">RSA-Private entschl.</text>

  <rect x="530" y="205" width="160" height="55" rx="8" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="2"/>
  <text x="610" y="227" text-anchor="middle" font-size="11" fill="#3E4A51">5. Daten mit AES</text>
  <text x="610" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E4620">entschlüsseln</text>

  <line x1="435" y1="170" x2="530" y2="160" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="185" x2="610" y2="205" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
