<svg width="700" height="260" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="140" height="50" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="45" y="50">Client (Opfer)</text>

  <rect x="520" y="20" width="140" height="50" fill="#EAF4E2" stroke="#4C9A2A"/>
  <text x="545" y="50">Gateway</text>

  <rect x="270" y="150" width="160" height="50" fill="#FBE3E6" stroke="#E2001A"/>
  <text x="300" y="180">Angreifer</text>

  <line x1="90" y1="70" x2="300" y2="150" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="80" y="120" fill="#E2001A">"Ich bin der Gateway"</text>

  <line x1="430" y1="170" x2="590" y2="70" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow1)" stroke-dasharray="4"/>
  <text x="420" y="130" fill="#E2001A">leitet Verkehr weiter</text>

  <text x="150" y="240" fill="#5C6971">Gefälschte ARP-Antwort lenkt den gesamten Verkehr des Clients über den Angreifer um</text>

</svg>
