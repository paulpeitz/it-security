<svg width="720" height="340" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E4A51"/>
    </marker>
  </defs>

  <text x="180" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3A4A">Signieren (Absender)</text>
  <text x="540" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E4620">Prüfen (Empfänger)</text>
  <line x1="360" y1="40" x2="360" y2="330" stroke="#C3CBCF" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Sign side -->
  <rect x="40" y="55" width="130" height="45" rx="8" fill="#EEF1F2" stroke="#5C6971" stroke-width="2"/>
  <text x="105" y="82" text-anchor="middle" font-size="12" fill="#3E4A51">Nachricht</text>

  <rect x="40" y="135" width="130" height="45" rx="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="105" y="162" text-anchor="middle" font-size="12" fill="#8A4B08">Hash bilden</text>
  <line x1="105" y1="100" x2="105" y2="135" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="215" width="130" height="55" rx="8" fill="#F0E6F1" stroke="#7D3C82" stroke-width="2"/>
  <text x="105" y="238" text-anchor="middle" font-size="11" fill="#3E4A51">Hash mit</text>
  <text x="105" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#5A2A5E">Private signieren</text>
  <line x1="105" y1="180" x2="105" y2="215" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- transmitted -->
  <rect x="230" y="130" width="120" height="90" rx="8" fill="#EEF1F2" stroke="#5C6971" stroke-width="2"/>
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#3E4A51">gesendet</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#3E4A51">Nachricht</text>
  <text x="290" y="185" text-anchor="middle" font-size="11" fill="#5A2A5E">+ Signatur</text>
  <line x1="170" y1="242" x2="230" y2="195" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="77" x2="230" y2="150" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verify side -->
  <rect x="410" y="70" width="130" height="50" rx="8" fill="#FCF0DC" stroke="#E8930A" stroke-width="2"/>
  <text x="475" y="92" text-anchor="middle" font-size="11" fill="#3E4A51">Hash der</text>
  <text x="475" y="108" text-anchor="middle" font-size="11" fill="#8A4B08">Nachricht neu</text>

  <rect x="410" y="160" width="130" height="55" rx="8" fill="#F0E6F1" stroke="#7D3C82" stroke-width="2"/>
  <text x="475" y="182" text-anchor="middle" font-size="11" fill="#3E4A51">Signatur mit</text>
  <text x="475" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#5A2A5E">Public entschl.</text>

  <line x1="350" y1="160" x2="410" y2="105" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="185" x2="410" y2="187" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- compare -->
  <rect x="410" y="255" width="250" height="55" rx="8" fill="#EAF4E2" stroke="#4C9A2A" stroke-width="2"/>
  <text x="535" y="278" text-anchor="middle" font-size="12" fill="#3E4A51">Hashes vergleichen &#8594;</text>
  <text x="535" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E4620">gleich = echt &amp; unverändert</text>
  <line x1="475" y1="120" x2="475" y2="255" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="215" x2="475" y2="255" stroke="#3E4A51" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
