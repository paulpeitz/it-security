<svg width="640" height="320" xmlns="http://www.w3.org/2000/svg"
     style="font-family: Arial, sans-serif; font-size: 13px">

  <rect x="20"  y="20"  width="600" height="280" fill="#EEF1F2" stroke="#5C6971"/>
  <text x="200" y="45" fill="#5C6971">Perimeter (Firewall)</text>

  <rect x="60"  y="60"  width="520" height="220" fill="#FCF0DC" stroke="#E8930A"/>
  <text x="180" y="85" fill="#E8930A">Netzwerk (Segmentierung, VLANs)</text>

  <rect x="100" y="100" width="440" height="160" fill="#E3F0F4" stroke="#1C7B96"/>
  <text x="220" y="125" fill="#1C7B96">Host (Endgeräteschutz)</text>

  <rect x="160" y="150" width="320" height="90" fill="#EAF4E2" stroke="#4C9A2A"/>
  <text x="260" y="180" fill="#4C9A2A">Daten</text>
  <text x="220" y="205" fill="#4C9A2A">(Verschlüsselung, TLS)</text>

</svg>
